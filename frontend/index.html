<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page" data-page="home">
    <main class="home-shell">
        <section class="brand-panel">
            <div class="brand">
                <span class="brand-mark">P</span>
                <span>User Dashboard App</span>
            </div>

            <div>
                <h1>Your dashboard starts here.</h1>
                <p>Sign in to manage your account, view your workspace summary, and keep your profile secure.</p>
            </div>

            <div class="preview-board" aria-hidden="true">
                <div class="preview-row">
                    <span class="preview-dot"></span>
                    <span class="preview-line"></span>
                    <span class="preview-value"></span>
                </div>
                <div class="preview-row">
                    <span class="preview-dot"></span>
                    <span class="preview-line"></span>
                    <span class="preview-value"></span>
                </div>
            </div>
        </section>

        <section class="form-panel home-content">
            <h1>Welcome back</h1>
            <p>Use your account to open the dashboard, or create a new profile in a few seconds.</p>
            <div class="actions">
                <a class="button" href="login.html">Login</a>
                <a class="button secondary" href="signup.html">Signup</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
