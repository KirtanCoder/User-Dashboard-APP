<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page" data-page="login">
    <main class="auth-shell">
        <section class="brand-panel">
            <div class="brand">
                <span class="brand-mark">P</span>
                <span>User Dashboard App</span>
            </div>

            <div>
                <h1>Good to see you again.</h1>
                <p>Access your account dashboard and pick up where you left off.</p>
            </div>

            <div class="preview-board" aria-hidden="true">
                <div class="preview-row">
                    <span class="preview-dot"></span>
                    <span class="preview-line"></span>
                    <span class="preview-value"></span>
                </div>
                <div class="preview-row">
                    <span class="preview-dot"></span>
                    <span class="preview-line"></span>
                    <span class="preview-value"></span>
                </div>
            </div>
        </section>

        <section class="form-panel">
            <h2>Login</h2>
            <p>Enter your account details.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button class="button" id="loginButton" type="submit">Login</button>
                <p class="message" id="msg" role="status" aria-live="polite"></p>
            </form>

            <p>New here? <a class="link-text" href="signup.html">Create an account</a></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
